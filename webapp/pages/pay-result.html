<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>支付结果 · 云栖山景区</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body>
<main class="app" data-title="支付结果" data-back="0" data-bar="none">
  <div class="pad">
    <div class="card tc" style="padding:26px 16px">
      <div class="result-icon" id="rIcon"></div>
      <div class="b s18" id="rTitle"></div>
      <div class="s13 muted mt8" id="rDesc"></div>
      <div class="mt12" style="font-weight:700;color:#e03131" id="rAmt"></div>
    </div>

    <div class="card mt12" id="infoCard"></div>

    <div class="card mt12 tc" style="background:#f6fbf9">
      <div class="s12 muted" id="tip"></div>
    </div>
  </div>

  <div class="padx mt12" id="actBox"></div>
  <div style="height:20px"></div>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var C = CORE, $ = C.$;
  var no = C.qs('no'), ok = C.qs('ok') === '1', reason = C.qs('reason');
  var order = C.Orders.byNo(no);
  if (!order) { location.replace('orders.html'); return; }

  if (ok) {
    if (order.status === 'pending') C.Orders.pay(order.no);
    order = C.Orders.byNo(no);
    $('#rIcon').className = 'result-icon ok';
    $('#rIcon').innerHTML = C.icon('check', '', 2.4);
    $('#rTitle').textContent = '支付成功';
    $('#rDesc').textContent = '预约已完成，请按时段入园';
    $('#rAmt').textContent = C.money(order.amount);
    $('#tip').innerHTML = '入园请出示订单二维码或本人身份证<br>游玩日前一天 24:00 前可免费取消';
    $('#actBox').innerHTML =
      '<div class="flex g8">' +
      '<a class="btn outline f1" href="../index.html">返回首页</a>' +
      '<a class="btn primary f1" href="order-detail.html?no=' + order.no + '">查看核销码</a></div>';
  } else {
    $('#rIcon').className = 'result-icon no';
    $('#rIcon').innerHTML = C.icon('close', '', 2.4);
    $('#rTitle').textContent = '支付未完成';
    $('#rDesc').textContent = reason === 'timeout' ? '支付超时，订单已自动取消，名额已释放'
      : reason === 'balance' ? '账户余额不足，请更换支付方式' : '支付已取消，订单尚未完成';
    $('#rAmt').textContent = C.money(order.amount);
    $('#tip').innerHTML = '如已扣款但未出票，系统将在 5 分钟内自动原路退款<br>如有疑问请联系客服 0571-8888 6688';
    var btns = '<div class="flex g8">' +
      '<a class="btn outline f1" href="orders.html">我的订单</a>';
    if (reason !== 'timeout') {
      btns += '<a class="btn primary f1" href="payment.html?no=' + order.no + '">重新支付</a>';
    } else {
      btns += '<a class="btn primary f1" href="booking.html">重新预约</a>';
    }
    $('#actBox').innerHTML = btns + '</div>';
  }

  $('#infoCard').innerHTML =
    '<div class="info-row"><span class="k">订单号</span><span>' + order.no + '</span></div>' +
    '<div class="info-row"><span class="k">票种</span><span>' + C.esc(order.ticket) + ' × ' + order.qty + '</span></div>' +
    '<div class="info-row"><span class="k">游玩日期</span><span>' + order.date + ' ' + C.dateLabel(order.date) + ' ' + order.time + '</span></div>' +
    '<div class="info-row" style="border:0"><span class="k">订单状态</span><span class="tag ' + C.statusOf(order.status).cls + '">' + C.statusOf(order.status).text + '</span></div>';
})();
</script>
</body>
</html>
