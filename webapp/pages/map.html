<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>电子导览地图 · 云栖山景区</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body>
<main class="app" data-title="电子导览地图" data-back="0" data-bar="portal" data-tab="map">

  <div class="pad">
    <div class="map-wrap">
      <div id="mapSvg"></div>
      <div class="map-tools">
        <button id="tFac" class="on" title="设施标注"></button>
        <button id="tRoute" title="路线规划"></button>
        <button id="tLoc" title="我的位置"></button>
      </div>
    </div>

    <div class="card mt12">
      <div class="flex ac jb">
        <div><div class="b s14">景区语音导览</div><div class="s12 muted" id="audioTip">点击播放，边走边听</div></div>
        <button class="ab-btn" id="abBtn" style="width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center"></button>
      </div>
      <div class="ab-wave mt8" id="abWave" style="display:flex;align-items:flex-end;gap:3px;height:24px">
        <i style="flex:1;background:#cfe9df;border-radius:2px;height:30%"></i>
        <i style="flex:1;background:#cfe9df;border-radius:2px;height:50%"></i>
        <i style="flex:1;background:#cfe9df;border-radius:2px;height:40%"></i>
        <i style="flex:1;background:#cfe9df;border-radius:2px;height:70%"></i>
        <i style="flex:1;background:#cfe9df;border-radius:2px;height:35%"></i>
      </div>
    </div>

    <div class="padt"><div class="sec-title"><h2>推荐路线</h2><span class="more">点击在地图中查看</span></div></div>
    <div class="padx"><div class="chips" id="routeBox"></div></div>

    <div class="padt"><div class="sec-title"><h2>全部景点</h2><span class="more" id="spotCount"></span></div></div>
    <div class="padx"><div id="spotList"></div></div>
  </div>
  <div style="height:10px"></div>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var C = CORE, $ = C.$;
  var W = 400, H = 280;
  var X = function (p) { return (p / 100 * W).toFixed(1); };
  var Y = function (p) { return (p / 100 * H).toFixed(1); };
  var spots = C.DB.spots();
  var facs = C.DB.facilities();

  var ROUTES = [
    { id: 'r1', name: '经典半日游（约 3 小时）', ids: C.DB.route(), color: '#f59f00' },
    { id: 'r2', name: '亲子轻松游（约 2 小时）', ids: ['s1', 's4', 's5', 's7'], color: '#1c7ed6' },
    { id: 'r3', name: '摄影一日游（约 5 小时）', ids: ['s1', 's2', 's3', 's6', 's5'], color: '#e03131' }
  ];
  var state = { fac: true, route: null, loc: false };

  var FAC = { wc: ['卫', '#1c7ed6'], park: ['停', '#f59f00'], center: ['服', '#0f8a6a'], med: ['医', '#e03131'], food: ['餐', '#d97706'] };

  function baseSvg() {
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="' + W + '" height="' + H + '" fill="#eaf3ee"/>' +
      /* 山体 */
      '<path d="M0 210 Q80 150 160 195 T300 160 T400 200 L400 280 L0 280Z" fill="#cfe6d8"/>' +
      '<path d="M0 240 Q100 200 200 232 T400 220 L400 280 L0 280Z" fill="#b9dcc9"/>' +
      /* 湖 */
      '<ellipse cx="' + X(60) + '" cy="' + Y(46) + '" rx="46" ry="30" fill="#a9dcea" opacity=".9"/>' +
      '<ellipse cx="' + X(60) + '" cy="' + Y(46) + '" rx="46" ry="30" fill="none" stroke="#8ac6d6" stroke-width="1.5"/>' +
      /* 溪流 */
      '<path d="M' + X(30) + ' ' + Y(34) + ' Q' + X(38) + ' ' + Y(42) + ' ' + X(46) + ' ' + Y(46) + ' T' + X(60) + ' ' + Y(52) + '" fill="none" stroke="#a9dcea" stroke-width="4" opacity=".8"/>' +
      /* 主路 */
      '<path d="M' + X(8) + ' ' + Y(90) + ' Q' + X(20) + ' ' + Y(70) + ' ' + X(14) + ' ' + Y(60) + '" fill="none" stroke="#cbbfae" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M' + X(14) + ' ' + Y(60) + ' Q' + X(30) + ' ' + Y(66) + ' ' + X(46) + ' ' + Y(70) + '" fill="none" stroke="#cbbfae" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M' + X(46) + ' ' + Y(70) + ' Q' + X(40) + ' ' + Y(52) + ' ' + X(30) + ' ' + Y(34) + '" fill="none" stroke="#cbbfae" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M' + X(30) + ' ' + Y(34) + ' Q' + X(42) + ' ' + Y(24) + ' ' + X(52) + ' ' + Y(18) + '" fill="none" stroke="#cbbfae" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M' + X(46) + ' ' + Y(70) + ' Q' + X(62) + ' ' + Y(58) + ' ' + X(72) + ' ' + Y(30) + '" fill="none" stroke="#cbbfae" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M' + X(72) + ' ' + Y(30) + ' Q' + X(80) + ' ' + Y(46) + ' ' + X(86) + ' ' + Y(62) + '" fill="none" stroke="#cbbfae" stroke-width="5" stroke-linecap="round"/>';
  }

  function draw() {
    var svg = baseSvg();
    /* 路线 */
    if (state.route) {
      var r = ROUTES.filter(function (x) { return x.id === state.route; })[0];
      if (r) {
        var pts = r.ids.map(function (id) {
          var s = spots.filter(function (x) { return x.id === id; })[0];
          return X(s.x) + ',' + Y(s.y);
        }).join(' ');
        svg += '<polyline class="route-path" points="' + pts + '" style="stroke:' + r.color + '"/>';
        r.ids.forEach(function (id, i) {
          var s = spots.filter(function (x) { return x.id === id; })[0];
          svg += '<circle cx="' + X(s.x) + '" cy="' + Y(s.y) + '" r="6" fill="#fff" stroke="' + r.color + '" stroke-width="2.5"/>' +
            '<text x="' + X(s.x) + '" y="' + (Y(s.y) - 10) + '" font-size="9" fill="' + r.color + '" text-anchor="middle">' + (i + 1) + '</text>';
        });
      }
    }
    /* 设施 */
    if (state.fac) {
      facs.forEach(function (f) {
        var c = FAC[f.type] || ['·', '#5c6b74'];
        svg += '<g class="fac-pin"><circle cx="' + X(f.x) + '" cy="' + Y(f.y) + '" r="8" fill="#fff" stroke="' + c[1] + '" stroke-width="1.5"/>' +
          '<text x="' + X(f.x) + '" y="' + (+Y(f.y) + 3.5) + '" font-size="8" fill="' + c[1] + '" text-anchor="middle" font-weight="600">' + c[0] + '</text></g>';
      });
    }
    /* 景点 */
    spots.forEach(function (s) {
      svg += '<g class="spot-pin" data-id="' + s.id + '">' +
        '<circle class="dot" cx="' + X(s.x) + '" cy="' + Y(s.y) + '" r="7"/>' +
        '<text x="' + X(s.x) + '" y="' + (Y(s.y) - 11) + '">' + C.esc(s.name) + '</text></g>';
    });
    /* 我的位置 */
    if (state.loc) {
      svg += '<circle cx="' + X(50) + '" cy="' + Y(92) + '" r="12" fill="#1c7ed6" opacity=".18">' +
        '<animate attributeName="r" values="6;18;6" dur="2s" repeatCount="indefinite"/></circle>' +
        '<circle cx="' + X(50) + '" cy="' + Y(92) + '" r="5" fill="#1c7ed6" stroke="#fff" stroke-width="2"/>' +
        '<text x="' + X(50) + '" y="' + (Y(92) + 20) + '" font-size="9" fill="#1c7ed6" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">我的位置</text>';
    }
    svg += '</svg>';
    $('#mapSvg').innerHTML = svg;
    C.$$('#mapSvg .spot-pin').forEach(function (el) {
      el.onclick = function () { location.href = 'spot.html?id=' + el.getAttribute('data-id'); };
    });
  }

  $('#tFac').innerHTML = C.icon('info');
  $('#tRoute').innerHTML = C.icon('route');
  $('#tLoc').innerHTML = C.icon('location');
  $('#tFac').onclick = function () { state.fac = !state.fac; $('#tFac').classList.toggle('on', state.fac); draw(); };
  $('#tRoute').onclick = function () {
    if (state.route) { state.route = null; } else { state.route = 'r1'; }
    $('#tRoute').classList.toggle('on', !!state.route);
    draw();
  };
  $('#tLoc').onclick = function () {
    state.loc = !state.loc;
    $('#tLoc').classList.toggle('on', state.loc);
    draw();
    if (state.loc) C.toast('已定位：游客中心附近', 'ok');
  };

  /* 路线 */
  $('#routeBox').innerHTML = ROUTES.map(function (r) {
    return '<div class="chip" data-r="' + r.id + '">' + C.esc(r.name) + '</div>';
  }).join('');
  C.$$('#routeBox .chip').forEach(function (el) {
    el.onclick = function () {
      state.route = el.getAttribute('data-r');
      $('#tRoute').classList.add('on');
      C.$$('#routeBox .chip').forEach(function (x) { x.classList.remove('on'); });
      el.classList.add('on');
      draw();
    };
  });

  /* 景点列表 */
  $('#spotCount').textContent = spots.length + ' 个景点';
  $('#spotList').innerHTML = spots.map(function (s) {
    return '<a class="list mb12" style="display:block" href="spot.html?id=' + s.id + '">' +
      '<div class="cell">' +
      '<div class="thumb" style="width:54px;height:44px;border-radius:8px;overflow:hidden;flex:none">' + C.thumb(s.k) + '</div>' +
      '<div class="f1"><div class="flex ac g8"><b class="s14">' + C.esc(s.name) + '</b>' +
      (s.hot ? '<span class="tag orange">热门</span>' : '') + '</div>' +
      '<div class="s12 muted mt6">' + C.esc(s.cat) + ' · ' + C.esc(s.duration) + ' · ' + C.esc(s.open) + '</div></div>' +
      '<span class="arrow">' + C.icon('right') + '</span></div></a>';
  }).join('');

  /* 语音导览 */
  var overview = '欢迎来到云栖山国家森林公园。景区面积十二点六平方公里，主要分为古径人文区、瀑布溪流区、高山观景区和亲子游乐区四大板块。您可以先沿云栖古径徒步上山，途经观音禅院与竹海听风，在飞云瀑布稍作休息，再登上望岳台远眺。如果带着孩子，推荐前往镜湖泛舟与索道观光。祝您旅途愉快。';
  var playing = false;
  $('#abBtn').innerHTML = C.icon('play');
  $('#abBtn').onclick = function () {
    if (playing) { C.stopSpeak(); playing = false; }
    else {
      playing = true;
      C.speak(overview, function () { playing = false; $('#abBtn').innerHTML = C.icon('play'); });
    }
    $('#abBtn').innerHTML = playing ? C.icon('pause') : C.icon('play');
    $('#abBtn').style.background = playing ? 'var(--accent)' : 'var(--primary)';
    $('#audioTip').textContent = playing ? '正在播放景区概览语音导览…' : '点击播放，边走边听';
  };

  draw();
})();
</script>
</body>
</html>
