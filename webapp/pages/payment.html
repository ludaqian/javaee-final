<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>订单支付 · 云栖山景区</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body>
<main class="app" data-title="收银台" data-back="0" data-bar="none">

  <div class="pad">
    <div class="card">
      <div class="card-hd"><h3>订单信息</h3><span class="tag orange" id="statusTag">待支付</span></div>
      <div id="orderBox"></div>
    </div>

    <div class="card mt12 tc">
      <div class="s12 muted">支付剩余时间</div>
      <div class="pay-timer"><span class="t countdown" id="timer">15:00</span></div>
      <div class="s12 muted">请在倒计时结束前完成支付，超时订单将自动释放名额</div>
    </div>

    <div class="card mt12">
      <div class="card-hd"><h3>选择支付方式</h3></div>
      <div id="payWays"></div>
    </div>

    <div class="card mt12" style="background:#f6fbf9">
      <div class="s12 muted">支付环境：演示环境（不会真实扣款）。点击"模拟支付失败"可查看失败流程。</div>
    </div>
    <div class="tc mt12"><button class="s12 muted" id="fakeFail" style="text-decoration:underline">模拟支付失败</button></div>
  </div>

  <div style="height:78px"></div>
</main>

<div class="footbar">
  <div class="f1">
    <div class="s12 muted">应付金额</div>
    <div style="color:#e03131;font-weight:700" id="footAmt">¥0.00</div>
  </div>
  <button class="btn primary" style="padding:0 40px" id="btnPay">立即支付</button>
</div>

<style>
.rd { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #d7e0e0; flex: none; }
.rd.on { border: 6px solid var(--primary); }
</style>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var C = CORE, $ = C.$;
  var no = C.qs('no');
  var order = C.Orders.byNo(no);
  if (!order) { location.replace('orders.html'); return; }
  if (order.status !== 'pending') { location.replace('pay-result.html?no=' + no + '&ok=1'); return; }

  $('#orderBox').innerHTML =
    '<div class="info-row"><span class="k">订单号</span><span>' + order.no + '</span></div>' +
    '<div class="info-row"><span class="k">票种</span><span class="b">' + C.esc(order.ticket) + ' × ' + order.qty + '</span></div>' +
    '<div class="info-row"><span class="k">游玩日期</span><span>' + order.date + ' ' + C.dateLabel(order.date) + '</span></div>' +
    '<div class="info-row"><span class="k">入园时段</span><span>' + order.time + '</span></div>' +
    '<div class="info-row" style="border:0"><span class="k b">支付金额</span><span class="b" style="color:#e03131">' + C.money(order.amount) + '</span></div>';
  $('#footAmt').textContent = C.money(order.amount);

  var ways = [
    { id: 'wx', name: '微信支付', sub: '推荐使用，零手续费', c: '#2f9e44' },
    { id: 'ali', name: '支付宝', sub: '花呗可分 3 期', c: '#1c7ed6' },
    { id: 'bank', name: '银行卡', sub: '支持储蓄卡 / 信用卡', c: '#f59f00' }
  ];
  var way = 'wx';
  function renderWays() {
    $('#payWays').innerHTML = ways.map(function (w) {
      return '<div class="cell" data-w="' + w.id + '" style="background:#fff;padding:12px 0">' +
        '<span style="width:26px;height:26px;border-radius:8px;background:' + w.c + ';color:#fff;display:grid;place-items:center;flex:none">' +
        (w.id === 'wx' ? C.icon('money') : w.id === 'ali' ? C.icon('money') : C.icon('money')) + '</span>' +
        '<div class="f1"><div class="s14 b">' + w.name + '</div><div class="s12 muted">' + w.sub + '</div></div>' +
        '<span class="' + (way === w.id ? 'rd on' : 'rd') + '"></span></div>';
    }).join('');
    C.$$('#payWays .cell').forEach(function (el) {
      el.onclick = function () { way = el.getAttribute('data-w'); renderWays(); };
    });
  }
  renderWays();

  /* 倒计时 15 分钟 */
  var left = 15 * 60;
  var timer = setInterval(function () {
    left--;
    if (left <= 0) {
      clearInterval(timer);
      C.Orders.cancel(order.no);
      C.toast('支付超时，订单已自动取消', 'err');
      setTimeout(function () { location.replace('pay-result.html?no=' + order.no + '&ok=0&reason=timeout'); }, 800);
      return;
    }
    $('#timer').textContent = C.pad(Math.floor(left / 60)) + ':' + C.pad(left % 60);
  }, 1000);

  function doPay() {
    var btn = $('#btnPay');
    btn.classList.add('disabled'); btn.textContent = '支付中...';
    $('#statusTag').textContent = '支付中';
    $('#statusTag').className = 'tag blue';
    setTimeout(function () { go(Math.random() < 0.9 ? 1 : 0); }, 1200);
  }
  function go(ok, reason) {
    location.href = 'pay-result.html?no=' + order.no + '&ok=' + ok + (reason ? '&reason=' + reason : '');
  }
  $('#btnPay').onclick = doPay;
  $('#fakeFail').onclick = function () { go(0, 'balance'); };
})();
</script>
</body>
</html>
