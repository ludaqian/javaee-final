<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户与权限 · 云栖山景区管理后台</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-shell" data-nav="users">
  <main class="admin-main" data-crumb="系统 / 用户与权限">
    <div class="admin-body">

      <div class="panel">
        <div class="p-hd">
          <h3>核销员与管理员账号</h3>
          <div class="filters">
            <select class="select" id="fRole">
              <option value="">全部角色</option>
              <option value="admin">景区管理员</option>
              <option value="checker">检票员</option>
            </select>
            <button class="btn primary sm" id="btnAdd">+ 新增账号</button>
          </div>
        </div>
        <div class="p-bd flush">
          <div style="overflow-x:auto"><table class="table" id="tb"></table></div>
          <div class="pager" style="padding:12px 16px"><span class="s12 muted" id="count"></span></div>
        </div>
      </div>

      <div class="panel mt16">
        <div class="p-hd"><h3>游客账号</h3><span class="s12 muted">游客端注册用户（手机号即为账号）</span></div>
        <div class="p-bd flush">
          <div style="overflow-x:auto"><table class="table" id="vtb"></table></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var C = CORE, $ = C.$;
  var PERMS = [
    { k: 'dashboard', t: '仪表盘' }, { k: 'ticket', t: '票种管理' }, { k: 'inventory', t: '库存管理' },
    { k: 'order', t: '订单管理' }, { k: 'reserve', t: '预约记录' }, { k: 'spot', t: '景点资源' },
    { k: 'notice', t: '公告管理' }, { k: 'user', t: '用户管理' }, { k: 'setting', t: '系统设置' },
    { k: 'scan', t: '扫码核销' }, { k: 'manual', t: '手动核销' }, { k: 'record', t: '核销记录' }
  ];

  function render() {
    var role = $('#fRole').value;
    var list = C.DB.users().filter(function (u) { return !role || u.role === role; });
    $('#tb').innerHTML =
      '<tr><th>账号</th><th>姓名</th><th>角色</th><th>手机号</th><th>负责闸口</th><th>权限</th><th>状态</th><th style="width:200px">操作</th></tr>' +
      list.map(function (u) {
        return '<tr>' +
          '<td class="b">' + C.esc(u.username) + '</td>' +
          '<td>' + C.esc(u.name) + '</td>' +
          '<td>' + (u.role === 'admin' ? '<span class="tag green">管理员</span>' : '<span class="tag blue">检票员</span>') + '</td>' +
          '<td class="s12">' + C.esc(u.phone) + '</td>' +
          '<td class="s12">' + C.esc(u.gate) + '</td>' +
          '<td>' + (u.perms || []).slice(0, 4).map(function (p) {
            var o = PERMS.filter(function (x) { return x.k === p; })[0];
            return '<span class="tag gray">' + (o ? o.t : p) + '</span>';
          }).join(' ') + ((u.perms || []).length > 4 ? ' <span class="s12 muted">+' + (u.perms.length - 4) + '</span>' : '') + '</td>' +
          '<td>' + (u.status ? '<span class="tag green">启用</span>' : '<span class="tag red">停用</span>') + '</td>' +
          '<td><button class="s12 primary" data-edit="' + u.id + '">编辑</button> ' +
          '<button class="s12" data-perm="' + u.id + '">分配权限</button> ' +
          '<button class="s12" data-sw="' + u.id + '">' + (u.status ? '停用' : '启用') + '</button> ' +
          '<button class="s12 danger" data-del="' + u.id + '">删除</button></td></tr>';
      }).join('');
    $('#count').textContent = '共 ' + list.length + ' 个账号';

    $('#vtb').innerHTML =
      '<tr><th>姓名</th><th>手机号</th><th>注册时间</th><th>实名状态</th><th>常用游客</th><th>订单数</th></tr>' +
      C.DB.visitors().map(function (v) {
        var n = C.Orders.all().filter(function (o) { return o.contact && o.contact.phone === v.phone; }).length;
        return '<tr><td class="b">' + C.esc(v.name) + '</td><td class="s12">' + C.esc(v.phone) + '</td>' +
          '<td class="s12">--</td>' +
          '<td>' + (v.real ? '<span class="tag green">已实名</span>' : '<span class="tag gray">未实名</span>') + '</td>' +
          '<td class="s12">' + ((v.contacts || []).length) + ' 人</td>' +
          '<td class="s12">' + n + ' 单</td></tr>';
      }).join('');
  }

  function openForm(id) {
    var u = id ? C.DB.users().filter(function (x) { return x.id === id; })[0] : { username: '', name: '', role: 'checker', phone: '', gate: '南门', status: 1, pwd: '123456' };
    C.formDialog({
      title: id ? '编辑账号' : '新增账号',
      fields: [
        { k: 'username', label: '登录账号', value: u.username, required: 1 },
        { k: 'name', label: '姓名', value: u.name, required: 1 },
        { k: 'role', label: '角色', type: 'select', value: u.role, options: [{ v: 'admin', t: '景区管理员' }, { v: 'checker', t: '检票员' }] },
        { k: 'phone', label: '手机号', value: u.phone },
        { k: 'gate', label: '负责闸口', type: 'select', value: u.gate || '南门', options: ['南门', '北门', '东门', '西门', '-'].map(function (g) { return { v: g, t: g }; }) },
        { k: 'pwd', label: '登录密码', value: u.pwd },
        { k: 'status', label: '启用状态', type: 'switch', value: u.status }
      ],
      onOk: function (d) {
        if (!d.username.trim() || !d.name.trim()) { C.toast('请填写账号与姓名', 'err'); return false; }
        if (!/^1\d{10}$/.test(d.phone)) { C.toast('手机号格式有误', 'err'); return false; }
        C.DB.update(function (db) {
          var o = id ? db.users.filter(function (x) { return x.id === id; })[0] : null;
          if (!o) { o = { id: 'u' + Date.now().toString(36), perms: ['scan', 'manual', 'record'] }; db.users.push(o); }
          Object.assign(o, {
            username: d.username.trim(), name: d.name.trim(), role: d.role, phone: d.phone,
            gate: d.gate, pwd: d.pwd || '123456', status: +d.status
          });
          if (!o.perms) o.perms = d.role === 'admin' ? ['dashboard', 'ticket', 'inventory', 'order', 'reserve', 'spot', 'notice', 'user', 'setting'] : ['scan', 'manual', 'record'];
        });
        C.toast(id ? '账号已更新' : '账号已创建', 'ok');
        render();
      }
    });
  }

  function openPerm(id) {
    var u = C.DB.users().filter(function (x) { return x.id === id; })[0];
    var dlg = C.dialog({
      title: '分配权限 · ' + u.name,
      okText: '保存', cancelText: '取消',
      html: '<div class="perms" style="text-align:left">' + PERMS.map(function (p) {
        var has = (u.perms || []).indexOf(p.k) >= 0;
        return '<label><input type="checkbox" data-p="' + p.k + '"' + (has ? ' checked' : '') + '> ' + p.t + '</label>';
      }).join('') + '</div>',
      onOk: function () {
        var ps = [];
        C.$$('[data-p]', dlg).forEach(function (el) { if (el.checked) ps.push(el.getAttribute('data-p')); });
        if (!ps.length) { C.toast('请至少选择一项权限', 'err'); return false; }
        C.DB.update(function (db) {
          var o = db.users.filter(function (x) { return x.id === id; })[0];
          if (o) o.perms = ps;
        });
        C.toast('权限已更新', 'ok'); render();
      }
    });
    $('.dialog', dlg).style.maxWidth = '480px';
  }

  $('#btnAdd').onclick = function () { openForm(null); };
  $('#fRole').onchange = render;

  $('#tb').addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-edit]'))) { openForm(b.getAttribute('data-edit')); }
    if ((b = e.target.closest('[data-perm]'))) { openPerm(b.getAttribute('data-perm')); }
    if ((b = e.target.closest('[data-sw]'))) {
      var id1 = b.getAttribute('data-sw');
      C.DB.update(function (db) {
        var o = db.users.filter(function (x) { return x.id === id1; })[0];
        if (o) o.status = o.status ? 0 : 1;
      });
      C.toast('状态已更新', 'ok'); render();
    }
    if ((b = e.target.closest('[data-del]'))) {
      var id2 = b.getAttribute('data-del');
      C.confirmBox('删除后该账号将无法登录，确认删除？', function () {
        C.DB.update(function (db) { db.users = db.users.filter(function (x) { return x.id !== id2; }); });
        C.toast('账号已删除', 'ok'); render();
      }, { danger: true, okText: '删除' });
    }
  });

  render();
})();
</script>
</body>
</html>
